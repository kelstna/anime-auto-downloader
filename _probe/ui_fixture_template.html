      '2026-10-04 16:35:10 [INFO ] 已添加下载：[桜都字幕组] / Spy x Family [13][1080p] → D:\\Anime\\间谍过家家 第三季',
      '2026-10-04 16:35:12 [INFO ] 追番检查完成：检查 1 部，下载 1 集'
    ] }
  };

  const realFetch = window.fetch.bind(window);
  window.__calls = [];                       // 记录所有请求，供测试断言提交内容
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const path = url.split('?')[0];
    let sent = null;
    try { sent = init && init.body ? JSON.parse(init.body) : null; } catch (e) { sent = null; }
    window.__calls.push({ path, method: (init && init.method) || 'GET', body: sent });
    if (path.startsWith('/api/cover')) {
      // 用内联 SVG 当封面图
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2b2721"/><stop offset="1" stop-color="#6b6152"/></linearGradient></defs>
        <rect width="300" height="400" fill="url(#g)"/>
        <text x="150" y="205" font-size="34" fill="#f4efe3" text-anchor="middle" font-family="sans-serif">番剧封面</text>
      </svg>`;
      return Promise.resolve(new Response(svg, { status: 200, headers: { 'Content-Type': 'image/svg+xml' } }));
    }
    if (path === '/api/qb/test') {
      return Promise.resolve(json({ ok: true, base_url: 'http://127.0.0.1:8080', version: 'v5.2.1.10',
        webapi_version: '2.15.1', default_save_path: 'D:\\Anime', listen_port: 43420, categories: ['Bangumi'] }));
    }
    if (path === '/api/subscriptions/check-all') {
      return Promise.resolve(json({ ok: true, result: { checked: 1, downloaded: 1, elapsed: 6.2,
        details: [{ subject_id: 498378, name: '间谍过家家 第三季', found: 42, downloaded: 1 }] } }));
    }
    // 待下载队列：补下载 / 删除（mock 里点一下就「qBittorrent 恢复」，队列清空）
    if (path === '/api/queue/flush') {
      const n = queueItems.length;
      queueItems = [];
      queueRecovered = now;
      subscription.pending_count = 0;
      subscription.pending_episodes = [];
      return Promise.resolve(json({ ok: true, flushed: n, remaining: 0, queue: queueState() }));
    }
    if (path === '/api/queue/delete') {
      const id = (sent && sent.id) || '';
      queueItems = queueItems.filter(i => i.id !== id);
      subscription.pending_count = queueItems.length;
      subscription.pending_episodes = queueItems.map(i => i.episode);
      return Promise.resolve(json({ ok: true, removed: 1, queue: queueState() }));
    }
    if (responses[path] !== undefined) {
      // 队列是会变的（点补下载后清空），所以队列相关的响应要**现算**，不能用建表时的快照
      const body = responses[path];
      if (path === '/api/status' || path === '/api/subscriptions') {
        body.queue = queueState();
        if (path === '/api/subscriptions') {
          body.items = [{ ...subscription, pending_count: queueItems.length,
                          pending_episodes: queueItems.map(i => i.episode) }];
        }
      }
      return Promise.resolve(json(body));
    }
    // 其它写操作一律返回成功，便于截图各种状态
    return Promise.resolve(json({ ok: true, subscription, downloaded_now: true, error: '',
      user: { id: 100000, nickname: 'demo_user', username: '100000' } }));
  };

  function json(obj) {
    return new Response(JSON.stringify(obj), { status: 200, headers: { 'Content-Type': 'application/json' } });
  }
  window.__MOCK_READY__ = true;
})();
</script>

<script>
/* 截图/测量辅助：暴露给 CDP 调用 */
window.__probe = {
  /* 按番剧 id 找卡片：优先 data-subject-id，缺失时按标题文本兜底 */
  _card: function (subjectId) {
    const id = String(subjectId);
    let card = [...document.querySelectorAll('#anime-grid .card')]
      .find(c => c.dataset.subjectId === id || c.dataset.id === id);
    if (card) return card;
    const want = { '498378': '间谍过家家', '586255': '僵尸搜寻中',
                   '513878': '赛博朋克', '568244': '药屋少女' }[id];
    if (!want) return null;
    return [...document.querySelectorAll('#anime-grid .card')]
      .find(c => (c.textContent || '').includes(want)) || null;
  },
  openModal: function (subjectId) {
    const card = subjectId ? window.__probe._card(subjectId)
                           : document.querySelector('#anime-grid .card');
    if (card) card.click();
    return !!card;
  },
  switchView: function (name) {
    const btn = document.querySelector(`.nav-item[data-view="${name}"]`);
    if (btn) btn.click();
    return !!btn;
  },
  switchTab: function (name) {
    const tab = document.querySelector(`#m-tabs .tab[data-tab="${name}"]`);
    if (tab) tab.click();
    return !!tab;
  },
  ready: function () {
    return {
      appReady: document.body.classList.contains('app-ready'),
      cards: document.querySelectorAll('#anime-grid .card').length,
      rows: document.querySelectorAll('#res-body tr').length,
      groups: document.querySelectorAll('#group-list > *').length,
      subs: document.querySelectorAll('#sub-list > *').length
    };
  },
  setChecked: function (subjectId, on) {
    const card = window.__probe._card(subjectId);
    if (!card) return false;
    const box = card.querySelector('input[type=checkbox]');
    if (!box) return false;
    if (box.checked !== !!on) { box.checked = !!on; box.dispatchEvent(new Event('change', { bubbles: true })); }
    return true;
  },
  calls: function (path, method) {
    return (window.__calls || []).filter(c => c.path === path && (!method || c.method === method));
  },
  clearCalls: function () { window.__calls = []; },
  click: function (id) {
    const el = document.getElementById(id);
    if (el) { el.click(); return true; }
    return false;
  },
  selectOption: function (id, value) {
    const sel = document.getElementById(id);
    if (!sel) return false;
    const opt = [...sel.options].find(o => o.value === value);
    if (!opt) return false;
    sel.value = value;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    return true;
  },
  options: function (id) {
    const sel = document.getElementById(id);
    return sel ? [...sel.options].map(o => ({ v: o.value, t: o.textContent.trim() })) : null;
  }
};
</script>
